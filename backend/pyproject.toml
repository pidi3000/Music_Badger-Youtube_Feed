[project]
name = "music-badger-backend"
version = "3.0.0"
description = "Music Badger backend: tag-based YouTube upload feed with auto-synced subscriptions"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "itsdangerous>=2.2",
    "cryptography>=43.0",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
